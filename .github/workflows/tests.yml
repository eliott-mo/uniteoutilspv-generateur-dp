# La suite jouée sur Linux, à chaque poussée.
#
# Ce qu'elle ferme : ce que Windows ne peut pas montrer. Le 26/09/2026, deux
# défauts sont tombés sur des chefs de projet, en ligne, à une heure d'écart —
# une police mesurée avec des métriques crénées, que FreeType honore et que
# DirectWrite ignore ; et `fiona` importée sans être déclarée, présente sur le
# poste de développement et absente du conteneur. Les 772 tests passaient sur
# Windows dans les deux cas. Ils seraient tombés ici.
#
# Les tests marqués `reseau` sont exclus : ils interrogent la Géoplateforme, ce
# qui ferait dépendre le vert d'un service extérieur. `tests-reseau.yml` les
# joue seuls, le lundi.
#
# Et la séparation est tenue par la machine depuis le 29/09/2026 : les sockets
# sont coupées pour tout test qui ne porte pas la marque (`tests/sans_reseau.py`).
# Sans cela elle était déclarative, et un test qui sortait sans le dire passait
# tant que le service répondait — jusqu'aux deux rouges du 28/09, tombés sur du
# code sain.

name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # La version du conteneur Streamlit Cloud, relevée le 26/09/2026 dans
      # « Manage app → Settings → Python version ». Elle n'est pas celle du
      # poste de développement, qui est en 3.12 : c'est le déploiement qu'on
      # reproduit ici, pas l'atelier. Si le réglage du conteneur change, cette
      # ligne change avec lui — sinon la suite dirait vrai sur Linux et faux
      # sur le déploiement.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # Les mêmes paquets système que Streamlit Cloud installe, lus dans le
      # même fichier : les deux ne peuvent pas diverger. Et si `packages.txt`
      # repassait en CRLF, apt refuserait ici bruyamment — là où Streamlit
      # l'ignore en silence et laisse le rendu sans cairo.
      - name: Paquets système, depuis packages.txt
        run: |
          sudo apt-get update
          xargs -a packages.txt sudo apt-get install --no-install-recommends -y

      - name: Dépendances Python, aux versions épinglées
        run: python -m pip install -r requirements-dev.txt

      # Aptos est embarquée dans le dépôt et installée par `polices.installer_polices()`
      # au premier appel. Ce pas ne fait que le dire : si fontconfig ne la voyait
      # pas, `test_typographie.py` le montrerait.
      #
      # `shell: bash`, déclaré, et non le shell par défaut. Sans lui, GitHub
      # lance le pas en `bash -e`, **sans `pipefail`** : il prend le code de
      # sortie de `tee`, toujours 0, et aucun test ne peut faire virer la suite
      # au rouge. C'était le cas du 28/09 au 06/11/2026. Depuis le passage de
      # `ubuntu-latest` à Ubuntu 26 (19/10), pytest s'y arrêtait en douze
      # secondes au lieu de sept minutes, et le run restait vert. Déclaré, `bash`
      # devient `bash --noprofile --norc -eo pipefail` (documentation GitHub,
      # vérifiée le 06/11/2026).
      #
      # `-rfE`, et non `-rf` : le résumé court de pytest ne liste les erreurs —
      # de collecte comme de mise en place — qu'avec `E`, et « Dire ce qui est
      # tombé » ne lit que lui. Le premier rouge rendu par `pipefail`, le
      # 06/11/2026 — code 2 en six secondes, une collecte interrompue —, n'a
      # laissé aucune annotation qui dise quoi.
      - name: La suite, tests réseau exclus
        shell: bash
        run: python -m pytest -q -rfE -m "not reseau" | tee pytest.log

      # Les journaux d'un run demandent des droits d'administration sur le
      # dépôt ; les annotations et le résumé du job, non. Relevé le
      # 28/09/2026 : la suite était tombée depuis deux poussées et la page
      # publique n'en disait que « exit code 1 ». Un rouge qu'on ne peut pas
      # lire ne vaut pas mieux que pas de CI du tout.
      - name: Dire ce qui est tombé
        if: failure()
        run: |
          {
            echo "### Ce qui est tombé"
            echo '```'
            if grep -q "short test summary" pytest.log; then
              sed -n '/short test summary/,$p' pytest.log | head -60
            else
              tail -60 pytest.log
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -E '^(FAILED|ERROR)' pytest.log | head -10 | sed 's|^|::error::|' || true
          # La raison, et pas seulement le nom : une erreur de collecte ne se
          # dit qu'à sa ligne `E`, et le résumé du job ne s'affiche qu'aux
          # visiteurs connectés (constaté le 06/11/2026).
          grep -E '^E   ' pytest.log | sort -u | head -5 | sed 's|^E   |::error::|' || true
